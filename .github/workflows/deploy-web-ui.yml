name: Deploy Web UI to GitHub Pages

on:
  push:
    branches:
      - deploy
    paths:
      - "Web_UI/**"
      - ".github/workflows/deploy-web-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "16.20.2"
          cache: npm
          cache-dependency-path: Web_UI/package-lock.json

      - name: Install UI dependencies
        working-directory: Web_UI
        run: npm ci --legacy-peer-deps

      - name: Build GitHub Pages UI
        working-directory: Web_UI
        env:
          # CRA 3 promotes lint warnings to build errors when CI=true.
          # Keep warnings visible in the log without blocking this legacy UI build.
          CI: "false"
          REACT_APP_API_BASE_URL: ${{ vars.MAINTENIX_API_BASE_URL || 'http://localhost:5055' }}
        run: npm run build:github

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Web_UI/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
