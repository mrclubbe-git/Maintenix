name: Apply live v1.2 migration

on:
  push:
    branches:
      - migrate-live-v1.2
    paths:
      - ".github/workflows/migrate-live-v12.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: d6b11a80cfb13decaf1595fb60a19f76205821dcab2b6df62f5730b8628df6a5
      EXPECTED_B64_LENGTH: "226588"
      CI: "false"
      REACT_APP_API_BASE_URL: https://dev-api.main-tenix.com

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migrate-live-v1.2
          fetch-depth: 0

      - name: Reconstruct and verify migration archive
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/v1.2-clean/part{00..15} > /tmp/maintenix-v12.b64
          test "$(wc -c < /tmp/maintenix-v12.b64 | tr -d ' ')" = "$EXPECTED_B64_LENGTH"
          base64 --decode /tmp/maintenix-v12.b64 > /tmp/maintenix-v12.tar.xz
          echo "$EXPECTED_SHA256  /tmp/maintenix-v12.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/maintenix-v12
          tar -xJf /tmp/maintenix-v12.tar.xz -C /tmp/maintenix-v12

      - name: Rebuild formal-report templates and validate payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import shutil
          import zipfile

          root = Path('/tmp/maintenix-v12')
          for d in sorted(root.rglob('*.docx.dir')):
              target = Path(str(d)[:-4])
              with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for p in sorted(d.rglob('*')):
                      if p.is_file():
                          zf.write(p, p.relative_to(d).as_posix())
              shutil.rmtree(d)

          for p in root.rglob('*.pyc'):
              p.unlink()
          for d in sorted(root.rglob('__pycache__'), reverse=True):
              shutil.rmtree(d, ignore_errors=True)

          required = [
              root / 'Server_API/data/templates/area-sections.json',
              root / 'Server_API/data/templates/conveyor_system_checklist_questions.json',
              root / 'Server_API/data/templates/service-report-systems.json',
              root / 'Server_API/data/templates/formal-reports/CRA_Conveyor_Fire_Service_Report_Master_Template.docx',
              root / 'Server_API/data/templates/formal-reports/CRA_Server_Room_Fire_Service_Report_Master_Template.docx',
              root / 'Server_API/data/templates/formal-reports/CRA_Substation_Fire_Service_Report_Master_Template.docx',
              root / 'Server_API/formal-reporting/report_worker.py',
              root / 'Server_API/routes/dailyPlanner.js',
              root / 'Server_API/routes/formalReports.js',
              root / 'Server_API/routes/notifications.js',
              root / 'Web_UI/src/pages/DailyPlanner.js',
              root / 'Web_UI/src/pages/SectionReports.js',
              root / 'Web_UI/public/offline-sw.js',
              root / 'Web_UI/package.json',
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('Missing required migration files:\n' + '\n'.join(missing))

          for p in required[:3]:
              json.loads(p.read_text(encoding='utf-8'))

          for p in required[3:6]:
              with zipfile.ZipFile(p) as zf:
                  if zf.testzip() is not None:
                      raise SystemExit(f'Invalid DOCX ZIP: {p}')

          package = json.loads((root / 'Web_UI/package.json').read_text(encoding='utf-8'))
          if package.get('version') != '1.2.0':
              raise SystemExit(f"Unexpected Web UI version: {package.get('version')}")
          if package.get('homepage') != 'https://mrclubbe-git.github.io/Maintenix':
              raise SystemExit(f"Unexpected homepage: {package.get('homepage')}")
          PY
          python3 -m py_compile /tmp/maintenix-v12/Server_API/formal-reporting/report_worker.py

      - name: Apply v1.2 overlay
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/maintenix-v12/. .
          rm -rf Server_API/formal-reporting/__pycache__
          find Server_API -name '*.pyc' -delete

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: Web_UI/package-lock.json

      - name: Validate backend JavaScript and hosted configuration
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking JS syntax: $file"
            node --check "$file"
          done < <(find Server_API -type f -name '*.js' -print0)

          if grep -RIl \
            --include='*.js' \
            --include='*.jsx' \
            --include='*.json' \
            --include='*.html' \
            '100\.106\.40\.17' Server_API Web_UI/src Web_UI/public 2>/dev/null; then
            echo 'Obsolete private API URL remains in active source.'
            exit 1
          fi

          for expected in \
            '/api/server/status' \
            'https://mrclubbe-git.github.io' \
            '/api/daily-planner' \
            '/api/formal-reports' \
            '/api/notifications'; do
            echo "Checking Server_API/index.js for: $expected"
            grep -Fq "$expected" Server_API/index.js || {
              echo "Missing required server configuration: $expected"
              exit 1
            }
          done

      - name: Install Web UI dependencies
        working-directory: Web_UI
        run: npm ci --legacy-peer-deps

      - name: Build GitHub Pages Web UI
        working-directory: Web_UI
        run: npm run build:github

      - name: Validate GitHub Pages build
        shell: bash
        run: |
          set -euo pipefail
          test -f Web_UI/build/index.html
          test -f Web_UI/build/offline-sw.js
          grep -q 'https://dev-api.main-tenix.com' Web_UI/build/index.html
          grep -q 'Maintenix' Web_UI/build/index.html
          grep -q '1.2.0' Web_UI/package.json

      - name: Restore source version files and remove staging payload
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/maintenix-v12/Web_UI/src/appVersion.js Web_UI/src/appVersion.js
          rm -f Web_UI/public/version.json
          rm -rf .migration
          rm -f .github/workflows/migrate-live-v12.yml
          rm -rf Server_API/formal-reporting/__pycache__
          find Server_API -name '*.pyc' -delete

      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 1
          fi
          git commit -m 'feat: migrate development app to live v1.2'
          git push origin HEAD:migrate-live-v1.2
