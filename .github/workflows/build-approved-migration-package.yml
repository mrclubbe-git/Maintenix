name: Build Current Site Migration Package v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-approved-migration-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main baseline
        uses: actions/checkout@v4
        with:
          ref: 51300a11f7cc85e54093b8af2313aaea8190aeca
          path: approved-main

      - name: Checkout current served deploy
        uses: actions/checkout@v4
        with:
          ref: 8ef05c88f0d263a3bbf9161244f94aa667c1a966
          path: approved-deploy

      - name: Assemble migration package
        shell: bash
        run: |
          set -euo pipefail
          PKG_ROOT="$GITHUB_WORKSPACE/out/Maintenix_Current_Site_Migration_2026-10-19_v2"
          mkdir -p "$PKG_ROOT"

          # Exact frontend source currently served by the deploy branch.
          cp -a approved-deploy/Web_UI "$PKG_ROOT/Web_UI"

          # Backend source is the accepted/current CRA backend; current main has the same CRA tree.
          mkdir -p "$PKG_ROOT/Server_API"
          cp -a approved-main/Server_API/CRA "$PKG_ROOT/Server_API/CRA"

          # Runtime data is deliberately excluded from the migration package.
          # LIVE data must remain in place. DEV templates are copied separately
          # during migration, and nothing else is copied from DEV data.
          rm -rf "$PKG_ROOT/Server_API/CRA/data"

          mkdir -p "$PKG_ROOT/reference"
          cp approved-main/LIVE_MIGRATION_CHECKLIST.md "$PKG_ROOT/reference/LIVE_MIGRATION_CHECKLIST_APPROVED_BASELINE.md"
          cp approved-main/LIVE_V1.2_MIGRATION_NOTES.txt "$PKG_ROOT/reference/LIVE_V1.2_MIGRATION_NOTES.txt"
          cp approved-main/Server_API/CRA/SERVER_REQUIREMENTS.txt "$PKG_ROOT/reference/SERVER_REQUIREMENTS.txt"

          cat > "$PKG_ROOT/CURRENT_SITE_PROVENANCE.txt" <<'EOF'
          MAINTENIX CURRENT SITE MIGRATION SOURCE
          =======================================

          Frontend/deploy head currently served by the repo:
          8ef05c88f0d263a3bbf9161244f94aa667c1a966

          Successful GitHub Pages run for that head:
          39281337899

          Backend/source baseline:
          51300a11f7cc85e54093b8af2313aaea8190aeca

          Verified current main Server_API/CRA tree:
          35e7367e289e4f0a30213bdf7a90253a9de2476d

          Accepted backend Server_API/CRA tree:
          35e7367e289e4f0a30213bdf7a90253a9de2476d

          Therefore the current repo backend tree is byte-identical to the accepted
          backend tree. The frontend in this package is the exact currently served
          deploy state, including the native Web Push Mark-as-read/Acknowledge change.

          Templates are intentionally not packaged. They must be copied from CRA DEV
          using the staged procedure in MIGRATION_INSTRUCTIONS.md.

          This package intentionally excludes Server_API/CRA/data because LIVE data
          is migrated selectively, not overwritten wholesale.
          EOF

          cat > "$PKG_ROOT/DATA_MIGRATION_MATRIX.md" <<'EOF'
          MAINTENIX LIVE DATA MIGRATION MATRIX
          ====================================

          Do NOT treat Server_API/CRA/data as one keep/replace unit.

          PRESERVE THE LIVE COPY:
          - users.json
          - reports.meta.json
          - uploads/ (reports, PDFs, report pictures, call-out pictures, delivery notes/evidence)
          - stock.json
          - standby.json
          - daily-planner.json, if present
          - notifications.json, if present
          - user-preferences.json, if present
          - area-metadata.json, if present
          - profilepics/, if present
          - site-logs/, if present
          - push-subscriptions.json and web-push-vapid.json, if LIVE push is already in use
          - offline-lease-private.pem / offline-lease-public.pem, if already issued on LIVE
          - notification-delivery.json, if present
          - existing servicing/call-out drafts, payloads, status and queue state

          RESET/RECREATE ON LIVE:
          - sessions.json: back up, then remove so users authenticate under the new session implementation
          - presence.json: back up, then remove; it repopulates after reconnect
          - libreoffice-profile/: safe to recreate
          - temporary *.tmp files: remove only while Maintenix is stopped

          COPY FROM CRA DEV:
          - ONLY Server_API/CRA/data/templates/

          IMPORTANT: data/templates/areas.txt is runtime-mutable. Stage the DEV
          templates first, merge any LIVE-only Area names into the staged areas.txt,
          then install the staged template directory.

          DO NOT copy any other DEV data file or directory.

          Repository audit:
          The repo tracks reports.meta.json, standby.json, stock.json, users.json and
          templates/**. Post-import tracked data changes are in the template/configuration
          set. The production records remain LIVE-owned.
          EOF

          cat > "$PKG_ROOT/MIGRATION_INSTRUCTIONS.md" <<'EOF'
          # Maintenix current-site DEV -> LIVE migration instructions

          ## 1. Package identity

          This v2 migration package supersedes the earlier package.

          Frontend source is the exact `deploy` commit currently served by GitHub Pages:

          `8ef05c88f0d263a3bbf9161244f94aa667c1a966`

          GitHub Pages run `39281337899` completed successfully for that head.

          Backend source is the accepted/current CRA backend:

          `51300a11f7cc85e54093b8af2313aaea8190aeca`

          The current main `Server_API/CRA` tree and accepted backend tree both resolve to:

          `35e7367e289e4f0a30213bdf7a90253a9de2476d`

          This confirms the backend application source has not drifted.

          ## 2. Data migration is selective

          Do **not** keep or replace the whole LIVE `data/` directory as one unit.

          Use `DATA_MIGRATION_MATRIX.md`.

          The migration is:

          **current repo application source + current CRA DEV templates + existing LIVE production data**

          ## 3. Back up LIVE before changing anything

          Example:

          ```bash
          LIVE_CRA=/opt/apps/maintenix/Server_API/CRA
          TS=$(date +%Y%m%d-%H%M%S)

          sudo tar -C "$LIVE_CRA" -czf "/safe/backup/maintenix-cra-pre-migration-$TS.tgz" .
          sudo tar -C "$LIVE_CRA" -czf "/safe/backup/maintenix-data-pre-migration-$TS.tgz" data
          ```

          Verify the backup contains `data/users.json`, `data/reports.meta.json`,
          `data/uploads/` and existing production pictures/reports before continuing.

          ## 4. Stop LIVE Maintenix

          ```bash
          sudo systemctl stop <live-maintenix-service>
          ```

          Confirm the API and workers are stopped.

          ## 5. Install backend source while excluding data

          Unpack this migration archive into a staging directory.

          Copy the packaged backend source:

          ```bash
          rsync -a --delete \
            --exclude 'data/' \
            /path/to/unpacked/Maintenix_Current_Site_Migration_2026-10-19_v2/Server_API/CRA/ \
            "$LIVE_CRA/"
          ```

          Immediately verify:

          ```bash
          test -s "$LIVE_CRA/data/users.json"
          test -e "$LIVE_CRA/data/reports.meta.json"
          test -d "$LIVE_CRA/data/uploads"
          ```

          Stop and restore the backup if production data is missing.

          ## 6. Preserve LIVE production/business records

          Keep the LIVE versions of:

          - `users.json`
          - `reports.meta.json`
          - `uploads/` including historical reports, PDFs, pictures/evidence and delivery notes
          - `stock.json`
          - `standby.json`
          - `daily-planner.json` if present
          - `notifications.json` if present
          - `user-preferences.json` if present
          - `area-metadata.json` if present
          - `profilepics/` if present
          - `site-logs/` if present
          - existing LIVE Web Push subscriptions/VAPID key if already in use
          - existing LIVE offline-lease keys if already issued
          - notification delivery state if present
          - existing servicing/call-out drafts, queues, payloads and status files

          Never replace these with DEV content.

          ## 7. Reset only ephemeral LIVE state

          With Maintenix still stopped:

          ```bash
          rm -f "$LIVE_CRA/data/sessions.json"
          rm -f "$LIVE_CRA/data/presence.json"
          rm -rf "$LIVE_CRA/data/libreoffice-profile"
          find "$LIVE_CRA/data" -type f -name '*.tmp' -delete
          ```

          This forces new authenticated sessions/presence under the migrated version
          while leaving business data intact.

          ## 8. Copy templates from CRA DEV only

          CRA DEV template source:

          `/home/charl/projects/maintenix-dev-api/Server_API/CRA/data/templates/`

          Stage only that directory:

          ```bash
          TEMPLATE_STAGE="/tmp/maintenix-templates-$TS"
          mkdir -p "$TEMPLATE_STAGE"

          rsync -a --delete \
            /home/charl/projects/maintenix-dev-api/Server_API/CRA/data/templates/ \
            "$TEMPLATE_STAGE/"
          ```

          **Do not copy any other file or directory from CRA DEV `data/`.**

          Do not copy DEV users, reports, pictures/uploads, stock, standby, sessions,
          notifications, preferences, keys, logs, drafts, queues, payloads or status.

          ## 9. Merge LIVE runtime-added Areas into DEV templates

          `data/templates/areas.txt` is runtime-mutable: Maintenix can add Areas to it.

          Preserve LIVE-only Areas by merging them into the staged DEV file before
          installing the template set:

          ```bash
          python3 - "$LIVE_CRA/data/templates/areas.txt" "$TEMPLATE_STAGE/areas.txt" <<'PY'
          from pathlib import Path
          import sys

          live_path = Path(sys.argv[1])
          stage_path = Path(sys.argv[2])

          def values(path):
              if not path.exists():
                  return []
              return [x.strip() for x in path.read_text(encoding="utf-8").splitlines() if x.strip()]

          merged = []
          seen = set()

          for value in values(stage_path) + values(live_path):
              key = " ".join(value.split()).casefold()
              if key and key not in seen:
                  seen.add(key)
                  merged.append(value)

          stage_path.write_text("\n".join(merged) + "\n", encoding="utf-8")
          print(f"Merged {len(merged)} unique Areas.")
          PY
          ```

          ## 10. Install the staged DEV templates

          Back up current LIVE templates first:

          ```bash
          cp -a "$LIVE_CRA/data/templates" "$LIVE_CRA/data/templates.pre-migration-$TS"
          ```

          Then install the staged template set:

          ```bash
          mkdir -p "$LIVE_CRA/data/templates"
          rsync -a --delete "$TEMPLATE_STAGE/" "$LIVE_CRA/data/templates/"
          ```

          This is the **only** content copied from CRA DEV.

          ## 11. New runtime files introduced during development

          If a current-code runtime file does not exist on LIVE, do not copy its DEV
          version. Leave it absent and let LIVE create its own file/key on first use.

          This is especially important for VAPID keys, offline-lease keys,
          notification delivery state, Site Logs and other runtime metadata/state.

          ## 12. Install backend dependencies

          ```bash
          cd "$LIVE_CRA"
          npm ci
          ```

          Do not run `npm audit fix`.

          Required system dependencies include Node.js 18+, Python 3,
          Python `python-docx`, LibreOffice headless and `pdftotext`.

          ## 13. Validate backend

          ```bash
          node --check index.js
          node --check startAll.js
          node --check servicingWorker.js
          node --check calloutWorker.js
          node --check notificationWorker.js
          node --check lib/notificationRegistry.js
          node --check lib/notificationService.js
          node --check lib/notificationDelivery.js
          node --check lib/notifications.js
          node --check lib/pushNotifications.js
          node --check lib/areaMetadata.js
          node --check lib/reportStorage.js
          node --check routes/admin.js
          node --check routes/areas.js
          node --check routes/reports.js
          node --check routes/servicing.js
          node --check routes/callout.js
          node --check routes/push.js
          python3 formal-reporting/report_worker.py health
          ```

          Formal Reporting health must report `"ok": true`.

          ## 14. Frontend deployment

          `Web_UI/` in this archive is the exact source currently served by the repo
          at deploy head `8ef05c88f0d263a3bbf9161244f94aa667c1a966`.

          Build this source for the final LIVE origin and LIVE public path.
          Do **not** deploy the existing GitHub Pages build unchanged because that
          build targets the CRA DEV API/GitHub Pages path.

          Do not publish a frontend still pointing to `dev-api.main-tenix.com`.

          ## 15. Final Cloudflare/hosting configuration

          Configure the final production frontend/API route and agreed Cloudflare
          security headers. Confirm LIVE frontend/API routing, `/uploads/*`, CORS,
          and the production scope for `maintenix-push-sw.js`.

          ## 16. Start LIVE

          The backend starts four long-running Node processes with:

          ```bash
          npm run start:all
          ```

          Start the existing LIVE supervisor:

          ```bash
          sudo systemctl start <live-maintenix-service>
          sudo systemctl status <live-maintenix-service> --no-pager
          ```

          ## 17. Health check

          ```bash
          curl -i http://127.0.0.1:<live-port>/api/health
          ```

          Expected body: `{"ok":true}`.

          Then validate the public LIVE health endpoint.

          ## 18. Mandatory production-data acceptance

          Verify existing LIVE users, reports, report pictures/evidence, uploads,
          Stock Control, Standby, Daily Planner/profile photos where used, runtime-added
          Areas, Site Logs and notification state remain intact. Then generate a new
          Servicing report, Call Out report and Formal/Section report and confirm new
          pictures can be stored/viewed without affecting historical content.

          Run the complete checklist in:

          `reference/LIVE_MIGRATION_CHECKLIST_APPROVED_BASELINE.md`

          ## 19. Rollback

          If validation fails, stop the migrated service, restore the full pre-migration
          CRA backup and data/template backups as required, start the previous version,
          and verify login, reports, pictures and API health.

          Never use DEV runtime data as rollback data.

          ## 20. Final rule

          Do not copy the whole DEV `data/` directory.
          Do not replace the whole LIVE `data/` directory.

          Use only current repo application source, CRA DEV `data/templates/`
          (with LIVE `areas.txt` merged), and existing LIVE production records.
          EOF

          find "$PKG_ROOT" -type f -print | sort > "$PKG_ROOT/PACKAGE_FILE_LIST.txt"

          # Safety gate: fail if any runtime data was accidentally included.
          if find "$PKG_ROOT/Server_API/CRA" -path '*/data/*' -o -path '*/data' | grep -q .; then
            echo "ERROR: Server_API/CRA/data unexpectedly exists in package." >&2
            exit 1
          fi

          grep -q 'Acknowledge' "$PKG_ROOT/Web_UI/public/maintenix-push-sw.js"
          grep -q 'Mark as read' "$PKG_ROOT/Web_UI/public/maintenix-push-sw.js"

          cat > "$PKG_ROOT/SUPERSEDES_PREVIOUS_PACKAGE.txt" <<'EOF'
          DO NOT USE THE EARLIER Maintenix_Approved_Migration_2026-10-19.zip.
          This v2 package corrects LIVE data handling and uses the exact currently
          served repo frontend.
          EOF

          cd "$GITHUB_WORKSPACE/out"
          zip -qr Maintenix_Current_Site_Migration_2026-10-19_v2.zip Maintenix_Current_Site_Migration_2026-10-19_v2
          sha256sum Maintenix_Current_Site_Migration_2026-10-19_v2.zip > Maintenix_Current_Site_Migration_2026-10-19_v2.zip.sha256

      - name: Upload migration package
        uses: actions/upload-artifact@v4
        with:
          name: Maintenix_Current_Site_Migration_2026-10-19_v2
          path: |
            out/Maintenix_Current_Site_Migration_2026-10-19_v2.zip
            out/Maintenix_Current_Site_Migration_2026-10-19_v2.zip.sha256
          if-no-files-found: error
          retention-days: 30
