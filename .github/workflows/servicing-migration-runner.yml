name: Run servicing checklist migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/servicing-migration-runner.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: Web_UI/package-lock.json

      - name: Extract and apply servicing migration
        shell: bash
        run: |
          python3 -c "from pathlib import Path; raw=Path('.github/workflows/servicing-formal-style-migration.yml').read_text(); start=raw.index(\"          python3 - <<'PY'\\n\")+len(\"          python3 - <<'PY'\\n\"); end=raw.index(\"          PY\\n\\n      - name: Install UI dependencies\", start); src=raw[start:end]; src='\\n'.join((line[10:] if line.startswith('          ') else line) for line in src.split('\\n')); Path('/tmp/migrate_servicing.py').write_text(src); compile(src, '/tmp/migrate_servicing.py', 'exec')"
          python3 /tmp/migrate_servicing.py

      - name: Install UI dependencies
        working-directory: Web_UI
        run: npm ci --legacy-peer-deps

      - name: Build UI
        working-directory: Web_UI
        env:
          CI: 'false'
          REACT_APP_API_BASE_URL: https://dev-api.main-tenix.com
        run: npm run build:github

      - name: Commit migration and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/servicing-formal-style-migration.yml
          rm -f .github/workflows/servicing-migration-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Web_UI/src/pages/Servicing.js Server_API/lib/servicingGenerator.js .github/workflows/servicing-formal-style-migration.yml .github/workflows/servicing-migration-runner.yml
          git commit -m 'feat: redesign servicing checklist defect workflow'
          git push origin HEAD:main
